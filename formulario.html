<body>
    <form id="meuformulario" action="https://webhook.site/77cdcd3f-639e-4a90-aadd-5f454d5bcfbd">
        <label for="none">NOME:</label>
        <input type="text" id="none" name="nome" placeholder="digite seu nome aqui:" required>

        <label for="email">E-MAIL:</label>
        <input type="email" id="email" name="email" placeholder="seu email aqui:">
       

        <label for="senha">SENHA:</label>
        <input type="password" id="senha" name="senha" placeholder="digite sua senha aqui:" minlength="8"pattern="(?.*[a-z])(?.*[A-Z])(?.*\d)(?.*[@$!%*?&])" required>
        
        <label for="idade">IDADE:</label>
        <input type="number" idade="idade " name="idade" min="0 " max="120" step="1" required>

       <p><button type="submit">ENVIAR OS DADOS</button></p>
    </form>
    
    
</body>
