<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="estilo.css"
</head>
<body>
    <h1>FORMULÁRIO DE CADASTRO</h1>

    <form action="https://webhook.site/77cdcd3f-639e-4a90-aadd-5f454d5bcfbd" method="POST">
        <label for="nome">NOME:</label>
        <input type="text" id="nome" name="nome" required minlength="2" maxlength="50" placeholder="digite seu nome aqui:">

        <br><br>

        <label for="email">E-MAIL:</label>
        <input type="email" id="email" name="email" required placeholder="digite seu E-MAIL aqui:">

        <br><br>

        <label for="telefone">TELEFONE:</label>
        <input type="tel" id="telefone" name="telefone" required placeholder="(XX)XXXXX-XXXX" pattern="\(\d{2}\) \d{4,5}-\d{4}">

        <br><br>
            
        <label for="idade">IDADE:</label>
        <input type="number" id="idade" name="idade" required min="18" max="120">

        <br><br>

        <label for="data-nascimento">DATA DE NASCIMENTO:</label>
        <input type="date" id="data-nascimento" name="data-nascimento" required min="1900-01-01" max="2026-07-24">

        <br><br>

        <label for="website">PÁGINA PESSOAL:</label>
        <input type="url" id="website" name="website" placeholder="https://www.seusite.com">

        <br><br>

        <label for="comentarios">COMENTÁRIOS:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="50" maxlength="500" placeholder="deixe seu comentário aqui:"></textarea>

        <br><br>

        <button type="submit">CLIQUE AQUI PARA ENVIAR DADOS</button>
    </form>
</body>
</html>
